name: Release

# Fires on any pushed tag starting with `v` (e.g. v0.5.0, v0.5.0-beta) and can
# also be kicked off manually via the Actions tab. Publishes a GitHub Release
# with a .deb for Linux x86_64 and a .dmg for macOS arm64.
#
# The jobs cannot share a runner — each build needs its own platform's WebView
# — so the Linux job creates the release and owns its notes, and the macOS job
# only appends its own asset to it.
#
# Windows is deliberately absent. Nothing here is hostile to it, but this app
# has never been run there and the suite's line on untested platforms is an
# honest gap rather than a build that looks like support.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.5.0-beta)"
        required: true

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      # Action versions below run on the Node 24 Actions runtime
      # (checkout v6, setup-node v6, action-gh-release v3). GitHub
      # deprecated the Node 20 action runtime in 2025.
      - uses: actions/checkout@v6
        with:
          # Build the ref being released, not whatever the workflow ran from.
          # A workflow_dispatch names the tag to publish, but checkout defaults
          # to the branch the run was started on — so without this the build
          # comes from main and its artifacts get uploaded to that tag's
          # release, which then holds binaries the tag never contained. A tag
          # push is unaffected: github.ref is already refs/tags/<tag>.
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The standard Tauri 2 Linux set. Shorter than the media apps' because
      # this app links nothing extra: no keyring (libsecret), no audio crate
      # (libasound2) — speech shells out to a system binary instead.
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file

      # Node 24, not the suite's usual 20. This repo runs its TypeScript
      # directly — `node compose.ts` with no build step — which needs the
      # native type stripping of Node 23+, and package.json says so in
      # `engines`. On Node 20 the data check below does not run at all.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      # Same order install.sh uses, and for its reason: the data layer is cheap
      # to check and the app is worthless if it is wrong. A composed form that
      # disagrees with golden.ts should stop a release, not ship in one.
      - name: Check the composer
        run: node compose.ts check

      # deb only, and the omissions are both deliberate.
      #
      # rpm: rpmbuild isn't installed on ubuntu runners.
      #
      # AppImage: it cannot coexist with src-tauri/counting.desktop. Tauri
      # builds the AppImage from the same file tree as the deb, so both get
      # that one template — but they need opposite things from it. The deb
      # needs an absolute `Exec` to beat the `counting` CLI on PATH; AppRun
      # `execvp`s whatever `Exec` says, and a path with a slash in it skips
      # the PATH lookup that would otherwise find the AppImage's own bundled
      # binary first. Verified, not assumed: with the template in place the
      # AppImage exits with
      #   Error: Error executing '/usr/bin/counting': No such file or directory
      # Shipping one again means giving it a desktop file of its own.
      - name: Build Tauri bundle (.deb)
        run: npm run tauri build -- --bundles deb

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # Publishes the release directly (not as a draft) so the assets land on
      # the tagged release in one step — no duplicate-record cleanup later.
      # The `prerelease` flag is auto-set from the tag: anything with a hyphen
      # (v0.5.0-beta, v0.6.0-rc.1) is a pre-release; plain `vX.Y.Z` isn't.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb

  build-macos-arm64:
    name: Build macOS (arm64)
    # Runs after the Linux job so the release (and its notes) already exist;
    # this job only appends the .dmg to it.
    needs: build-linux-x86_64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # No apt step here, and nothing stands in for it: speech reaches `say`,
      # which ships with macOS. This is the platform where the listening drill
      # actually works — on Linux the same build returns an honest error.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      # Unsigned and un-notarised, like the rest of the suite: Gatekeeper
      # refuses the first launch until the app is opened from the context
      # menu, or cleared with
      # `xattr -dr com.apple.quarantine /Applications/counting.app`.
      #
      # This produces the same bundle install.sh builds locally; the .dmg is
      # the shippable wrapper around it. install.sh stays the path for a local
      # build-and-relaunch, since it also quits the running copy.
      - name: Build Tauri bundle (.dmg)
        run: npm run tauri build -- --bundles dmg

      # Reuse the Linux job's tag logic verbatim.
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # Appends the .dmg to the release the Linux job already published. No
      # `name`/`generate_release_notes` here — the Linux job owns those; this
      # step only adds its asset so the two jobs don't clobber each other.
      # `prerelease` is repeated so this update states the same flag the Linux
      # job set, rather than leaving it to the action's default.
      - name: Upload macOS bundle to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
